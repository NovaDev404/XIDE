[package]
name = "xide"
version = "0.1.0"
edition = "2024"

[lib]
name = "xide_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
isideload = "0.5.2"
rfd = "0.15"
